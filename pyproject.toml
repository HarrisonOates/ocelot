[project]
name = "ocelot"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "python-sat",
    "networkx",
    "bauhaus",
    "tarski",
    "clingo",
]

[project.scripts]
ocelot = "scripts.run_planner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
