[project]
name = "ocelot"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "python-sat",
    "networkx",
    "bauhaus",
    "tarski",
    "clingo",
]

[project.scripts]
ocelot = "scripts.run_planner:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end pipeline test; requires the C++ binaries (./build.sh)",
]
